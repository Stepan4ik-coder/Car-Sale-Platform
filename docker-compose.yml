services:

  car_sale_back_service:
    depends_on:
      - car_sale_postgres_service
      - car_sale_cache_service
    container_name: "car_sale_back"
    build:
      context: .
    ports:
      - "7777:8000"
    networks:
      - my_network
    env_file:
      - ".env"
    environment:
      DB_HOST: car_sale_postgres_service
      REDIS_HOST: car_sale_cache_service


  car_sale_postgres_service:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    networks: [my_network]


  car_sale_cache_service:
    image: redis:7
    ports:
      - "6379:6379"
    networks: [my_network]



  car_sale_celery_worker_service:
    container_name: "car_sale_celery_worker"
    build:
      context: .
    networks:
      - my_network
    env_file:
      - ".env"
    environment:
      DB_HOST: car_sale_postgres_service
      REDIS_HOST: car_sale_cache_service
    command: celery --app=src.tasks.celery_app:celery_app worker -l INFO


networks:
  my_network:
    external: true

