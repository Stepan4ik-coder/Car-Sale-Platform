services:

  car_sale_back_service:
    depends_on:
      - car_sale_postgres_service
      - car_sale_cache_service
    container_name: "car_sale_back"
    build:
      context: .
    ports:
      - "7777:8000"
    networks:
      - my_network
    env_file:
      - ".env"


  car_sale_postgres_service:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales_platform
    ports:
      - "6432:5432"
    networks: [my_network]


  car_sale_cache_service:
    image: redis:7
    ports:
      - "6666:6379"
    networks: [my_network]



  car_sale_celery_worker_service:
    container_name: "car_sale_celery_worker"
    build:
      context: .
    networks:
      - my_network
    env_file:
      - ".env"
    command: celery --app=src.tasks.celery_app:celery_app worker -l INFO


networks:
  my_network:
    external: true

